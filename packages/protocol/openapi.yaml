{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Philcoino ESP32 API",
    "version": "3.0.0",
    "description": "Breaking, HTTPS-only local API. All authenticated mutations return a complete acknowledged state snapshot."
  },
  "servers": [
    {
      "url": "https://{host}",
      "variables": {
        "host": {
          "default": "philcoino.local",
          "description": "mDNS hostname or manually selected local address"
        }
      }
    }
  ],
  "paths": {
    "/healthz": {
      "get": {
        "operationId": "getHealth",
        "security": [],
        "responses": {
          "200": { "description": "HTTPS service health.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } } }
        }
      }
    },
    "/api/v3/pairing/sessions": {
      "post": {
        "operationId": "startPairingSession",
        "security": [],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingSessionStartRequest" } } } },
        "responses": {
          "200": { "description": "A bounded SRP-6a session and server hello. Device identity is untrusted until the encrypted binding is verified.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingSessionStart" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/pairing/sessions/{sessionId}/proof": {
      "post": {
        "operationId": "verifyPairingProof",
        "security": [],
        "parameters": [{ "name": "sessionId", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/PairingSessionId" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingSessionProofRequest" } } } },
        "responses": {
          "200": { "description": "Verified SRP server proof and authenticated encrypted certificate binding.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingSessionProof" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/pairing/sessions/{sessionId}/complete": {
      "post": {
        "operationId": "completePairingSession",
        "security": [],
        "x-requiresPinnedTls": true,
        "parameters": [{ "name": "sessionId", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/PairingSessionId" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingSessionCompleteRequest" } } } },
        "responses": {
          "200": { "description": "New client credential. A fifth client evicts the oldest issued credential.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PairingComplete" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/state": {
      "get": {
        "operationId": "getState",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/settings": {
      "patch": {
        "operationId": "updateSettings",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SettingsPatch" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v3/mode": {
      "put": {
        "operationId": "setMode",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModeRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/heater-permission": {
      "put": {
        "operationId": "setHeaterPermission",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HeaterPermissionRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/faults/over-temperature/dismiss": {
      "post": {
        "operationId": "dismissOverTemperatureFault",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/temperature-calibrations/current": {
      "post": {
        "operationId": "startTemperatureCalibration",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      },
      "patch": {
        "operationId": "updateTemperatureCalibrationCandidate",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TemperatureCalibrationCandidate" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      },
      "put": {
        "operationId": "saveTemperatureCalibration",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SessionRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      },
      "delete": {
        "operationId": "cancelTemperatureCalibration",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SessionRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/temperature-calibrations/current/lease": {
      "post": {
        "operationId": "renewTemperatureCalibrationLease",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SessionRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/scale-calibrations/current": {
      "post": {
        "operationId": "startScaleCalibration",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      },
      "put": {
        "operationId": "completeScaleCalibration",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleCalibrationComplete" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      },
      "delete": {
        "operationId": "cancelScaleCalibration",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/scale/warnings/acknowledge": {
      "post": {
        "operationId": "acknowledgeScaleWarning",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/extractions": {
      "post": {
        "operationId": "startExtraction",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExtractionStart" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/extractions/current": {
      "delete": {
        "operationId": "stopExtraction",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v3/extractions/current/stream": {
      "get": {
        "operationId": "streamCurrentExtraction",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "name": "extractionId", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/OpaqueId" } },
          { "name": "bootId", "in": "query", "required": false, "schema": { "type": "string", "pattern": "^[0-9a-f]{32}$" } },
          { "name": "afterSequence", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 0 } }
        ],
        "responses": {
          "200": {
            "description": "Four-hertz SSE stream. Event IDs contain boot, extraction, and sequence identity.",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "const": "no-cache" } }
            },
            "content": {
              "text/event-stream": {
                "schema": { "type": "string", "description": "Telemetry events with two-second comment heartbeats." },
                "x-eventDataSchema": { "$ref": "#/components/schemas/TelemetryPage" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/StreamBusy" }
        }
      }
    },
    "/api/v3/cooldowns": {
      "post": {
        "operationId": "startCooldown",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IdempotencyRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v3/cooldowns/current": {
      "delete": {
        "operationId": "stopCooldown",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "$ref": "#/components/responses/State" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "256-bit opaque token" }
    },
    "responses": {
      "State": { "description": "Complete acknowledged state.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/State" } } } },
      "BadRequest": { "description": "Malformed or invalid request.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing, invalid, revoked, or evicted credential.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "Request conflicts with current state.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "StreamBusy": { "description": "One telemetry subscriber is already active.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "RateLimited": { "description": "Pairing challenge rate limit exceeded.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "InternalError": { "description": "Internal or persistence failure.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    },
    "schemas": {
      "Base64Url256": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]{43}$" },
      "Identifier": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$" },
      "OpaqueId": { "type": "string", "minLength": 16, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._~-]*$" },
      "Health": {
        "type": "object", "additionalProperties": false, "required": ["status", "uptimeMs"],
        "properties": { "status": { "const": "ok" }, "uptimeMs": { "type": "integer", "minimum": 0 } }
      },
      "DeviceIdentity": {
        "type": "object", "additionalProperties": false,
        "required": ["deviceId", "name", "model", "apiVersion", "firmwareVersion"],
        "properties": {
          "deviceId": { "$ref": "#/components/schemas/Identifier" },
          "name": { "type": "string", "minLength": 1, "maxLength": 64 },
          "model": { "type": "string", "minLength": 1, "maxLength": 64 },
          "apiVersion": { "const": "3" },
          "firmwareVersion": { "type": "string", "minLength": 1, "maxLength": 32 }
        }
      },
      "PairingSessionId": { "type": "string", "minLength": 32, "maxLength": 32, "pattern": "^[a-f0-9]{32}$" },
      "Base64Url96": { "type": "string", "minLength": 16, "maxLength": 16, "pattern": "^[A-Za-z0-9_-]{16}$" },
      "Base64Url512": { "type": "string", "minLength": 86, "maxLength": 86, "pattern": "^[A-Za-z0-9_-]{86}$" },
      "SrpPublicKey": { "type": "string", "minLength": 2, "maxLength": 512, "pattern": "^[A-Za-z0-9_-]+$" },
      "SrpSalt": { "type": "string", "minLength": 22, "maxLength": 86, "pattern": "^[A-Za-z0-9_-]+$" },
      "EncryptedPairingBinding": { "type": "string", "minLength": 23, "maxLength": 1024, "pattern": "^[A-Za-z0-9_-]+$" },
      "PairingSessionStartRequest": {
        "type": "object", "additionalProperties": false, "required": ["clientName", "clientNonce", "clientPublicKey"],
        "properties": {
          "clientName": { "type": "string", "minLength": 1, "maxLength": 64 },
          "clientNonce": { "$ref": "#/components/schemas/Base64Url256" },
          "clientPublicKey": { "$ref": "#/components/schemas/SrpPublicKey" }
        }
      },
      "PairingSessionStart": {
        "type": "object", "additionalProperties": false,
        "required": ["sessionId", "device", "serverPublicKey", "salt", "expiresAtUptimeMs"],
        "properties": {
          "sessionId": { "$ref": "#/components/schemas/PairingSessionId" },
          "device": { "$ref": "#/components/schemas/DeviceIdentity" },
          "serverPublicKey": { "$ref": "#/components/schemas/SrpPublicKey" },
          "salt": { "$ref": "#/components/schemas/SrpSalt" },
          "expiresAtUptimeMs": { "type": "integer", "minimum": 0 }
        }
      },
      "PairingSessionProofRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["clientProof"],
        "properties": {
          "clientProof": { "$ref": "#/components/schemas/Base64Url512" }
        }
      },
      "PairingSessionProof": {
        "type": "object", "additionalProperties": false,
        "required": ["serverProof", "deviceNonce", "encryptedDeviceBinding"],
        "properties": {
          "serverProof": { "$ref": "#/components/schemas/Base64Url512" },
          "deviceNonce": { "$ref": "#/components/schemas/Base64Url96" },
          "encryptedDeviceBinding": { "$ref": "#/components/schemas/EncryptedPairingBinding" }
        }
      },
      "PairingSessionCompleteRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["clientId", "encryptedClientBinding"],
        "properties": {
          "clientId": { "type": "string", "pattern": "^[a-f0-9]{32}$" },
          "encryptedClientBinding": { "$ref": "#/components/schemas/EncryptedPairingBinding" }
        }
      },
      "PairingComplete": {
        "type": "object", "additionalProperties": false,
        "required": ["device", "certificateSpkiSha256", "clientId", "accessToken"],
        "properties": {
          "device": { "$ref": "#/components/schemas/DeviceIdentity" },
          "certificateSpkiSha256": { "$ref": "#/components/schemas/Base64Url256" },
          "clientId": { "type": "string", "pattern": "^[a-f0-9]{32}$" },
          "accessToken": { "$ref": "#/components/schemas/Base64Url256" }
        }
      },
      "SettingsPatch": {
        "type": "object", "additionalProperties": false, "minProperties": 1,
        "properties": {
          "brewTargetC": { "type": "integer", "minimum": 85, "maximum": 95 },
          "steamTargetC": { "type": "integer", "minimum": 110, "maximum": 135 },
          "steamControl": {
            "type": "object", "additionalProperties": false, "minProperties": 1,
            "properties": {
              "initialCompensationC": { "type": "integer", "minimum": 0, "maximum": 20 },
              "decayDurationMs": { "type": "integer", "minimum": 60000, "maximum": 1800000, "multipleOf": 60000 },
              "readyTimeoutMs": { "type": "integer", "minimum": 60000, "maximum": 900000, "multipleOf": 60000 }
            }
          }
        }
      },
      "ModeRequest": {
        "type": "object", "additionalProperties": false, "required": ["mode"],
        "properties": { "mode": { "enum": ["brew", "steam"] } }
      },
      "HeaterPermissionRequest": {
        "type": "object", "additionalProperties": false, "required": ["enabled"],
        "properties": { "enabled": { "type": "boolean" } }
      },
      "SessionRequest": {
        "type": "object", "additionalProperties": false, "required": ["calibrationId"],
        "properties": { "calibrationId": { "$ref": "#/components/schemas/OpaqueId" } }
      },
      "TemperatureCalibrationCandidate": {
        "type": "object", "additionalProperties": false, "required": ["calibrationId", "candidateRawTargetC"],
        "properties": {
          "calibrationId": { "$ref": "#/components/schemas/OpaqueId" },
          "candidateRawTargetC": { "type": "integer", "minimum": 90, "maximum": 120 }
        }
      },
      "ScaleCalibrationComplete": {
        "type": "object", "additionalProperties": false, "required": ["referenceWeightDecigrams"],
        "properties": { "referenceWeightDecigrams": { "type": "integer", "minimum": 500, "maximum": 5000 } }
      },
      "IdempotencyRequest": {
        "type": "object", "additionalProperties": false, "required": ["idempotencyKey"],
        "properties": { "idempotencyKey": { "$ref": "#/components/schemas/OpaqueId" } }
      },
      "ExtractionStart": {
        "oneOf": [
          {
            "type": "object", "additionalProperties": false, "required": ["idempotencyKey", "selection"],
            "properties": {
              "idempotencyKey": { "$ref": "#/components/schemas/OpaqueId" },
              "selection": { "$ref": "#/components/schemas/ExtractionSelection" }
            }
          },
          {
            "type": "object", "additionalProperties": false, "required": ["idempotencyKey", "selection", "weightControl"],
            "properties": {
              "idempotencyKey": { "$ref": "#/components/schemas/OpaqueId" },
              "selection": { "$ref": "#/components/schemas/ProfileSelection" },
              "weightControl": { "$ref": "#/components/schemas/WeightControl" }
            }
          }
        ]
      },
      "ExtractionSelection": {
        "oneOf": [
          { "type": "object", "additionalProperties": false, "required": ["kind"], "properties": { "kind": { "const": "manual" } } },
          { "$ref": "#/components/schemas/ProfileSelection" }
        ]
      },
      "ProfileSelection": {
        "type": "object", "additionalProperties": false, "required": ["kind", "profileId", "profile"],
        "properties": {
          "kind": { "const": "profile" },
          "profileId": { "enum": ["profile-1", "profile-2", "profile-3", "profile-4"] },
          "profile": {
            "type": "object", "additionalProperties": false,
            "required": ["name", "preInfusionSeconds", "soakSeconds", "mainExtractionSeconds"],
            "properties": {
              "name": { "type": "string", "pattern": "^[A-Za-z0-9]{1,12}$" },
              "preInfusionSeconds": { "type": "integer", "minimum": 0, "maximum": 60 },
              "soakSeconds": { "type": "integer", "minimum": 0, "maximum": 60 },
              "mainExtractionSeconds": { "type": "integer", "minimum": 1, "maximum": 60 }
            }
          }
        }
      },
      "WeightControl": {
        "type": "object", "additionalProperties": false,
        "required": ["targetWeightDecigrams", "compensationDecigrams"],
        "properties": {
          "targetWeightDecigrams": { "type": "integer", "minimum": 50, "maximum": 1000 },
          "compensationDecigrams": { "type": "integer", "minimum": 0, "maximum": 100 }
        }
      },
      "Fault": {
        "type": "object", "additionalProperties": false, "required": ["code", "message"],
        "properties": {
          "code": { "enum": ["sensor_failure", "over_temperature", "heating_timeout", "internal_error"] },
          "message": { "type": "string", "minLength": 1, "maxLength": 160 }
        }
      },
      "BootId": { "type": "string", "minLength": 32, "maxLength": 32, "pattern": "^[0-9a-f]{32}$" },
      "SteamControlState": {
        "type": "object", "additionalProperties": false,
        "required": ["settings", "compensationActive", "appliedCompensationC", "controlTemperatureC", "heatSoakElapsedMs"],
        "properties": {
          "settings": {
            "type": "object", "additionalProperties": false,
            "required": ["initialCompensationC", "decayDurationMs", "readyTimeoutMs"],
            "properties": {
              "initialCompensationC": { "type": "integer", "minimum": 0, "maximum": 20 },
              "decayDurationMs": { "type": "integer", "minimum": 60000, "maximum": 1800000, "multipleOf": 60000 },
              "readyTimeoutMs": { "type": "integer", "minimum": 60000, "maximum": 900000, "multipleOf": 60000 }
            }
          },
          "compensationActive": { "type": "boolean" },
          "appliedCompensationC": { "type": "number", "minimum": 0, "maximum": 20 },
          "controlTemperatureC": { "type": ["number", "null"], "minimum": -40, "maximum": 180 },
          "heatSoakElapsedMs": { "type": ["integer", "null"], "minimum": 0, "maximum": 9007199254740991 }
        }
      },
      "State": {
        "type": "object", "additionalProperties": false,
        "required": ["apiVersion", "device", "bootId", "revision", "capturedAtUptimeMs", "machine", "scale", "temperatureCalibration", "extraction", "compensation", "cooldown"],
        "properties": {
          "apiVersion": { "const": "3" },
          "device": { "$ref": "#/components/schemas/DeviceIdentity" },
          "bootId": { "$ref": "#/components/schemas/BootId" },
          "revision": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "capturedAtUptimeMs": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "machine": { "$ref": "#/components/schemas/Machine" },
          "scale": { "$ref": "#/components/schemas/Scale" },
          "temperatureCalibration": { "$ref": "#/components/schemas/TemperatureCalibration" },
          "extraction": { "$ref": "#/components/schemas/ExtractionState" },
          "compensation": { "$ref": "#/components/schemas/CompensationState" },
          "cooldown": { "$ref": "#/components/schemas/CooldownState" }
        }
      },
      "Machine": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "activeMode", "boilerTemperatureC", "brewTargetC", "steamTargetC", "heaterEnabled", "heaterActive", "steamTimeoutRemainingMs", "steamControl", "uptimeMs", "fault"],
        "properties": {
          "status": { "enum": ["heating", "ready", "fault"] },
          "activeMode": { "enum": ["brew", "steam"] },
          "boilerTemperatureC": { "type": ["number", "null"], "minimum": -60, "maximum": 180 },
          "brewTargetC": { "type": "integer", "minimum": 85, "maximum": 95 },
          "steamTargetC": { "type": "integer", "minimum": 110, "maximum": 135 },
          "heaterEnabled": { "type": "boolean" },
          "heaterActive": { "type": "boolean" },
          "steamTimeoutRemainingMs": { "type": ["integer", "null"], "minimum": 0, "maximum": 900000 },
          "steamControl": { "$ref": "#/components/schemas/SteamControlState" },
          "uptimeMs": { "type": "integer", "minimum": 0 },
          "fault": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/Fault" }] }
        }
      },
      "ActiveWeightExtraction": {
        "type": "object", "additionalProperties": false,
        "required": ["extractionId", "mode", "targetWeightDecigrams", "compensationDecigrams", "cutoffWeightDecigrams", "netWeightDecigrams"],
        "properties": {
          "extractionId": { "$ref": "#/components/schemas/OpaqueId" },
          "mode": { "enum": ["weight", "timer-fallback"] },
          "targetWeightDecigrams": { "type": "integer", "minimum": 50, "maximum": 1000 },
          "compensationDecigrams": { "type": "integer", "minimum": 0, "maximum": 100 },
          "cutoffWeightDecigrams": { "type": "integer", "minimum": 1, "maximum": 1000 },
          "netWeightDecigrams": { "type": ["integer", "null"], "minimum": -11000, "maximum": 11000 }
        }
      },
      "TerminalWeightExtraction": {
        "type": "object", "additionalProperties": false,
        "required": ["extractionId", "targetWeightDecigrams", "compensationDecigrams", "cutoffWeightDecigrams", "finalWeightDecigrams", "settled", "completionReason", "fallbackOccurred"],
        "properties": {
          "extractionId": { "$ref": "#/components/schemas/OpaqueId" },
          "targetWeightDecigrams": { "type": "integer", "minimum": 50, "maximum": 1000 },
          "compensationDecigrams": { "type": "integer", "minimum": 0, "maximum": 100 },
          "cutoffWeightDecigrams": { "type": "integer", "minimum": 1, "maximum": 1000 },
          "finalWeightDecigrams": { "type": ["integer", "null"], "minimum": -11000, "maximum": 11000 },
          "settled": { "type": "boolean" },
          "completionReason": { "enum": ["weight-reached", "timer-fallback", "stopped", "safety-cutoff"] },
          "fallbackOccurred": { "type": "boolean" }
        }
      },
      "ScaleWarning": {
        "type": "object", "additionalProperties": false,
        "required": ["code", "extractionId", "acknowledged"],
        "properties": {
          "code": { "const": "scale_fallback" },
          "extractionId": { "$ref": "#/components/schemas/OpaqueId" },
          "acknowledged": { "const": false }
        }
      },
      "Scale": {
        "type": "object", "additionalProperties": false,
        "required": ["availability", "calibrationStatus", "stable", "grossWeightDecigrams", "netWeightDecigrams", "activeExtraction", "terminalExtraction", "warning"],
        "properties": {
          "availability": { "enum": ["unavailable", "unstable", "ready"] },
          "calibrationStatus": { "enum": ["uncalibrated", "calibrating", "calibrated"] },
          "stable": { "type": "boolean" },
          "grossWeightDecigrams": { "type": ["integer", "null"], "minimum": -500, "maximum": 10500 },
          "netWeightDecigrams": { "type": ["integer", "null"], "minimum": -11000, "maximum": 11000 },
          "activeExtraction": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/ActiveWeightExtraction" }] },
          "terminalExtraction": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/TerminalWeightExtraction" }] },
          "warning": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/ScaleWarning" }] }
        }
      },
      "TemperatureSafeBounds": {
        "type": "object", "additionalProperties": false,
        "required": ["brewMinimumC", "brewMaximumC", "steamMinimumC", "steamMaximumC"],
        "properties": {
          "brewMinimumC": { "const": 85 },
          "brewMaximumC": { "type": "integer", "minimum": 85, "maximum": 95 },
          "steamMinimumC": { "const": 110 },
          "steamMaximumC": { "type": "integer", "minimum": 110, "maximum": 135 }
        }
      },
      "TemperatureCalibration": {
        "oneOf": [
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "savedOffsetC", "boilerTemperatureRawC", "boilerTemperatureC", "heaterActive", "ready", "safeTargetBounds"],
            "properties": {
              "status": { "const": "uncalibrated" }, "savedOffsetC": { "const": 0 },
              "boilerTemperatureRawC": { "type": ["number", "null"], "minimum": -40, "maximum": 160 },
              "boilerTemperatureC": { "type": ["number", "null"], "minimum": -60, "maximum": 170 },
              "heaterActive": { "type": "boolean" }, "ready": { "type": "boolean" },
              "safeTargetBounds": { "$ref": "#/components/schemas/TemperatureSafeBounds" }
            }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "savedOffsetC", "boilerTemperatureRawC", "boilerTemperatureC", "heaterActive", "ready", "safeTargetBounds"],
            "properties": {
              "status": { "const": "calibrated" }, "savedOffsetC": { "type": "integer", "minimum": -20, "maximum": 10 },
              "boilerTemperatureRawC": { "type": ["number", "null"], "minimum": -40, "maximum": 160 },
              "boilerTemperatureC": { "type": ["number", "null"], "minimum": -60, "maximum": 170 },
              "heaterActive": { "type": "boolean" }, "ready": { "type": "boolean" },
              "safeTargetBounds": { "$ref": "#/components/schemas/TemperatureSafeBounds" }
            }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "savedOffsetC", "boilerTemperatureRawC", "boilerTemperatureC", "heaterActive", "ready", "safeTargetBounds", "calibrationId", "candidateRawTargetC", "offsetPreviewC", "advisoryStableMs", "sessionLeaseRemainingMs", "previewSafeTargetBounds"],
            "properties": {
              "status": { "const": "calibrating" }, "savedOffsetC": { "type": "integer", "minimum": -20, "maximum": 10 },
              "boilerTemperatureRawC": { "type": ["number", "null"], "minimum": -40, "maximum": 160 },
              "boilerTemperatureC": { "type": ["number", "null"], "minimum": -60, "maximum": 170 },
              "heaterActive": { "type": "boolean" }, "ready": { "type": "boolean" },
              "safeTargetBounds": { "$ref": "#/components/schemas/TemperatureSafeBounds" },
              "calibrationId": { "$ref": "#/components/schemas/OpaqueId" },
              "candidateRawTargetC": { "type": "integer", "minimum": 90, "maximum": 120 },
              "offsetPreviewC": { "type": "integer", "minimum": -20, "maximum": 10 },
              "advisoryStableMs": { "type": "integer", "minimum": 0 },
              "sessionLeaseRemainingMs": { "type": "integer", "minimum": 0, "maximum": 15000 },
              "previewSafeTargetBounds": { "$ref": "#/components/schemas/TemperatureSafeBounds" }
            }
          }
        ]
      },
      "ExtractionState": {
        "oneOf": [
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "extractionId", "selection", "phase", "elapsedMs", "remainingMs", "pumpCommand"],
            "properties": {
              "status": { "const": "idle" }, "extractionId": { "type": "null" }, "selection": { "type": "null" },
              "phase": { "const": "idle" }, "elapsedMs": { "const": 0 }, "remainingMs": { "type": "null" }, "pumpCommand": { "const": "off" }
            }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "extractionId", "selection", "phase", "elapsedMs", "remainingMs", "pumpCommand"],
            "properties": {
              "status": { "const": "running" }, "extractionId": { "$ref": "#/components/schemas/OpaqueId" },
              "selection": { "$ref": "#/components/schemas/ExtractionSelection" },
              "phase": { "enum": ["manual", "pre-infusion", "soak", "main-extraction"] },
              "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 60000 },
              "remainingMs": { "type": "integer", "minimum": 0, "maximum": 60000 },
              "pumpCommand": { "enum": ["running", "off"] }
            }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "extractionId", "selection", "phase", "elapsedMs", "remainingMs", "pumpCommand", "outcome"],
            "properties": {
              "status": { "const": "idle" }, "extractionId": { "$ref": "#/components/schemas/OpaqueId" },
              "selection": { "$ref": "#/components/schemas/ExtractionSelection" }, "phase": { "const": "idle" },
              "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 60000 }, "remainingMs": { "type": "null" },
              "pumpCommand": { "enum": ["running", "off"] }, "outcome": { "enum": ["completed", "stopped", "failed"] }
            }
          }
        ]
      },
      "CompensationState": {
        "oneOf": [
          { "type": "object", "additionalProperties": false, "required": ["status", "phase"], "properties": { "status": { "const": "inactive" }, "phase": { "type": "null" } } },
          { "type": "object", "additionalProperties": false, "required": ["status", "phase"], "properties": { "status": { "const": "active" }, "phase": { "enum": ["manual", "main-extraction"] } } }
        ]
      },
      "CooldownState": {
        "oneOf": [
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "cooldownId", "brewTargetC", "elapsedMs", "remainingMs", "pumpCommand", "heaterInhibited", "outcome"],
            "properties": { "status": { "const": "idle" }, "cooldownId": { "type": "null" }, "brewTargetC": { "type": "null" }, "elapsedMs": { "const": 0 }, "remainingMs": { "type": "null" }, "pumpCommand": { "const": "off" }, "heaterInhibited": { "const": false }, "outcome": { "type": "null" } }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "cooldownId", "brewTargetC", "elapsedMs", "remainingMs", "pumpCommand", "heaterInhibited", "outcome"],
            "properties": { "status": { "const": "idle" }, "cooldownId": { "$ref": "#/components/schemas/OpaqueId" }, "brewTargetC": { "type": "integer", "minimum": 85, "maximum": 95 }, "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 50000 }, "remainingMs": { "type": "null" }, "pumpCommand": { "enum": ["running", "off"] }, "heaterInhibited": { "const": false }, "outcome": { "enum": ["target-reached", "cutoff", "stopped", "failed"] } }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "cooldownId", "brewTargetC", "elapsedMs", "remainingMs", "pumpCommand", "heaterInhibited", "outcome"],
            "properties": { "status": { "const": "pumping" }, "cooldownId": { "$ref": "#/components/schemas/OpaqueId" }, "brewTargetC": { "type": "integer", "minimum": 85, "maximum": 95 }, "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 45000 }, "remainingMs": { "type": "integer", "minimum": 0, "maximum": 45000 }, "pumpCommand": { "const": "running" }, "heaterInhibited": { "const": true }, "outcome": { "type": "null" } }
          },
          {
            "type": "object", "additionalProperties": false,
            "required": ["status", "cooldownId", "brewTargetC", "elapsedMs", "remainingMs", "pumpCommand", "heaterInhibited", "outcome"],
            "properties": { "status": { "const": "stabilizing" }, "cooldownId": { "$ref": "#/components/schemas/OpaqueId" }, "brewTargetC": { "type": "integer", "minimum": 85, "maximum": 95 }, "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 50000 }, "remainingMs": { "type": "integer", "minimum": 0, "maximum": 5000 }, "pumpCommand": { "const": "off" }, "heaterInhibited": { "const": true }, "outcome": { "enum": ["target-reached", "cutoff", "stopped"] } }
          }
        ]
      },
      "TelemetryCursor": {
        "type": "object", "additionalProperties": false, "required": ["extractionId", "bootId", "afterSequence"],
        "properties": { "extractionId": { "$ref": "#/components/schemas/OpaqueId" }, "bootId": { "$ref": "#/components/schemas/BootId" }, "afterSequence": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 } }
      },
      "TelemetrySample": {
        "type": "object", "additionalProperties": false,
        "required": ["sequence", "uptimeMs", "elapsedMs", "extractionElapsedMs", "phase", "boilerTemperatureC", "activeTargetC", "heaterActive", "pumpCommand", "scaleAvailability", "netWeightDecigrams"],
        "properties": {
          "sequence": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "uptimeMs": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "elapsedMs": { "type": "integer", "minimum": 0, "maximum": 70000 },
          "extractionElapsedMs": { "type": "integer", "minimum": 0, "maximum": 60000 },
          "phase": { "enum": ["manual", "pre-infusion", "soak", "main-extraction", "settling"] },
          "boilerTemperatureC": { "type": ["number", "null"], "minimum": -60, "maximum": 180 },
          "activeTargetC": { "type": "integer", "minimum": 85, "maximum": 95 },
          "heaterActive": { "type": "boolean" }, "pumpCommand": { "enum": ["running", "off"] },
          "scaleAvailability": { "enum": ["unavailable", "unstable", "ready"] },
          "netWeightDecigrams": { "type": ["integer", "null"], "minimum": -11000, "maximum": 11000 }
        }
      },
      "TelemetryPage": {
        "type": "object", "additionalProperties": false,
        "required": ["version", "deviceId", "extractionId", "bootId", "capturedAtUptimeMs", "selection", "controlMode", "weightControl", "baselineWeightDecigrams", "status", "outcome", "terminalWeight", "oldestSequence", "latestSequence", "nextCursor", "hasMore", "continuity", "samples"],
        "properties": {
          "version": { "const": 1 }, "deviceId": { "$ref": "#/components/schemas/Identifier" },
          "extractionId": { "$ref": "#/components/schemas/OpaqueId" }, "bootId": { "$ref": "#/components/schemas/BootId" },
          "capturedAtUptimeMs": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "selection": { "$ref": "#/components/schemas/ExtractionSelection" }, "controlMode": { "enum": ["manual", "timed", "weight"] },
          "weightControl": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/WeightControl" }] },
          "baselineWeightDecigrams": { "type": ["integer", "null"], "minimum": -500, "maximum": 10500 },
          "status": { "enum": ["running", "settling", "terminal"] }, "outcome": { "type": ["string", "null"], "enum": ["completed", "stopped", "failed", null] },
          "terminalWeight": { "oneOf": [{ "type": "null" }, { "$ref": "#/components/schemas/TerminalWeightExtraction" }] },
          "oldestSequence": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "latestSequence": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          "nextCursor": { "$ref": "#/components/schemas/TelemetryCursor" }, "hasMore": { "type": "boolean" },
          "continuity": { "enum": ["initial", "continuous", "truncated", "reset"] },
          "samples": { "type": "array", "minItems": 1, "maxItems": 16, "items": { "$ref": "#/components/schemas/TelemetrySample" } }
        }
      },
      "Error": {
        "type": "object", "additionalProperties": false, "required": ["error"],
        "properties": {
          "error": {
            "type": "object", "additionalProperties": false, "required": ["code", "message"],
            "properties": {
              "code": {
                "enum": ["malformed_request", "unauthorized", "pairing_busy", "pairing_session_expired", "pairing_session_replayed", "pairing_stage_mismatch", "invalid_pairing_code", "extraction_active", "cooldown_active", "brew_mode_required", "cooldown_not_required", "sensor_unavailable", "machine_faulted", "idempotency_mismatch", "scale_not_calibrated", "scale_not_stable", "scale_unavailable", "scale_warning_unacknowledged", "calibration_in_progress", "heater_disabled", "temperature_calibration_active", "temperature_calibration_inactive", "temperature_calibration_session_mismatch", "temperature_calibration_expired", "temperature_target_unsafe", "stream_unavailable", "stream_busy", "persistence_failure", "internal_error"]
              },
              "message": { "type": "string", "minLength": 1, "maxLength": 160 }
            }
          }
        }
      }
    }
  }
}
