{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://spec.openapis.org/oas/3.1/dialect/base",
  "info": {
    "title": "Philcoino ESP32 API",
    "version": "1.0.0",
    "description": "Local-network API for monitoring and configuring one Philcoino espresso machine."
  },
  "servers": [
    {
      "url": "http://{host}",
      "variables": {
        "host": {
          "default": "philcoino.local",
          "description": "mDNS hostname or manually entered local IP address"
        }
      }
    }
  ],
  "paths": {
    "/healthz": {
      "get": {
        "operationId": "getHealth",
        "summary": "Read process and network health",
        "security": [],
        "responses": {
          "200": {
            "description": "The device HTTP service is healthy.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HealthResponse" }
              }
            }
          }
        }
      }
    },
    "/api/v1/device": {
      "get": {
        "operationId": "getDevice",
        "summary": "Read public device identity",
        "security": [],
        "responses": {
          "200": {
            "description": "Stable device identity and version information.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/DeviceResponse" }
              }
            }
          },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v1/state": {
      "get": {
        "operationId": "getMachineState",
        "summary": "Read the complete machine snapshot",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Current temperatures, targets, control state, and fault data.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MachineState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v1/settings/temperatures": {
      "patch": {
        "operationId": "updateTemperatureSettings",
        "summary": "Validate and persist one or both temperature targets",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/TemperatureSettingsRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Both persisted targets after the requested update.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TemperatureSettingsResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v1/mode": {
      "put": {
        "operationId": "setMode",
        "summary": "Idempotently select the active temperature-control mode",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ModeRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The resulting acknowledged mode.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ModeResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v1/heater": {
      "put": {
        "operationId": "setHeaterPermission",
        "summary": "Allow or inhibit automatic heater output",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/HeaterSettingsRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The resulting acknowledged volatile heater permission.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HeaterSettingsResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v1/faults/over-temperature/dismiss": {
      "post": {
        "operationId": "dismissOverTemperature",
        "summary": "Dismiss a recoverable over-temperature fault after cooldown",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "The fresh machine snapshot after the over-temperature fault is dismissed.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/OverTemperatureDismissResponse" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/v2/state": {
      "get": {
        "operationId": "getMachineStateV2",
        "summary": "Read acknowledged machine, extraction, compensation, and cooldown state",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Current API v1 machine state plus firmware-acknowledged extraction, compensation, and cooldown state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MachineStateV2" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/settings/steam-control": {
      "get": {
        "operationId": "getSteamControlSettings",
        "summary": "Read persisted Steam heat-soak settings and live estimator state",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Firmware-authoritative persisted settings and current transient Steam estimator state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SteamControlState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      },
      "patch": {
        "operationId": "updateSteamControlSettings",
        "summary": "Validate and atomically persist one or more Steam heat-soak settings",
        "description": "The heater is commanded off before persistence. A successful update adopts the settings without restarting an existing heat-soak or Ready timestamp. Updates are rejected while the machine is faulted.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/SteamControlSettingsRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Acknowledged persisted settings and recomputed live estimator state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SteamControlState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/temperature-calibration": {
      "get": {
        "operationId": "getTemperatureCalibration",
        "summary": "Read temperature-calibration state and optionally renew its lease",
        "description": "Omit calibrationId while no calibration is active. While calibrating, the opaque active calibrationId is required and a matching request renews the 15-second inactivity lease.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "calibrationId",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/TemperatureCalibrationSessionId" }
          }
        ],
        "responses": {
          "200": {
            "description": "Current firmware-authoritative calibration state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TemperatureCalibrationState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/temperature-calibration/start": {
      "post": {
        "operationId": "startTemperatureCalibration",
        "summary": "Start a firmware-owned raw-temperature calibration session",
        "description": "Starts at raw 100 degrees Celsius when uncalibrated or at the raw boiling point implied by the saved offset when recalibrating. The operation never commands the pump or steam valve.",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "The acknowledged active calibration session.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ActiveTemperatureCalibrationState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/temperature-calibration/candidate": {
      "put": {
        "operationId": "updateTemperatureCalibrationCandidate",
        "summary": "Update the active raw calibration target",
        "description": "Changes the whole-degree raw target and resets advisory stability without changing the saved offset.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/UpdateTemperatureCalibrationCandidateRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The acknowledged active calibration state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ActiveTemperatureCalibrationState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/temperature-calibration/save": {
      "post": {
        "operationId": "saveTemperatureCalibration",
        "summary": "Persist the active candidate as logical 100 degrees Celsius",
        "description": "Persists offset = 100 - candidateRawTargetC. The previous offset and all temperature targets remain unchanged if persistence or raw-ceiling reachability validation fails.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/TemperatureCalibrationSessionRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The acknowledged persisted calibrated state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CalibratedTemperatureCalibrationState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/temperature-calibration/cancel": {
      "post": {
        "operationId": "cancelTemperatureCalibration",
        "summary": "Cancel the active calibration and restore ordinary Brew control",
        "description": "Discards the candidate without changing the saved offset or persisted Brew and Steam targets.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/TemperatureCalibrationSessionRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The acknowledged uncalibrated or calibrated state after cancellation.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TemperatureCalibrationState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/history": {
      "get": {
        "operationId": "getTemperatureHistory",
        "summary": "Read a bounded page of volatile device history",
        "description": "Returns observational one-Hertz samples from the current boot. Supply neither cursor parameter for an initial page or supply both for continuation.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "bootId",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistoryBootId" }
          },
          {
            "name": "afterSequence",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistorySequence" }
          }
        ],
        "responses": {
          "200": {
            "description": "One ordered history page and the cursor for the next page.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HistoryPage" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale": {
      "get": {
        "operationId": "getScaleState",
        "summary": "Read calibration, live weight, weighted extraction, and warning state",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Current firmware-authoritative scale state.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleState" } } }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale/trace": {
      "get": {
        "operationId": "getScaleTrace",
        "summary": "Read current scale state and a bounded weighted-extraction trace page",
        "description": "Observation-only telemetry. Supply no cursor parameters for the retained trace's initial page or supply extractionId, bootId, and afterSequence together for continuation.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "extractionId",
            "in": "query",
            "required": false,
            "schema": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._~-]*$" }
          },
          {
            "name": "bootId",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistoryBootId" }
          },
          {
            "name": "afterSequence",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistorySequence" }
          }
        ],
        "responses": {
          "200": {
            "description": "Current strict scale state plus the retained trace page, or null when no weighted trace exists.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleTraceResponse" } } }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale/calibration/start": {
      "post": {
        "operationId": "startScaleCalibration",
        "summary": "Capture the stable unloaded-platform calibration point",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Calibration session started with its zero point captured.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleState" } } }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale/calibration/complete": {
      "post": {
        "operationId": "completeScaleCalibration",
        "summary": "Persist calibration from a stable reference load",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CompleteScaleCalibrationRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Persisted calibrated scale state.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleState" } } }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale/calibration/cancel": {
      "post": {
        "operationId": "cancelScaleCalibration",
        "summary": "Cancel the volatile calibration session",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Current scale state with no calibration session.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleState" } } }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/scale/warnings/acknowledge": {
      "post": {
        "operationId": "acknowledgeScaleWarning",
        "summary": "Acknowledge the retained weighted-extraction fallback warning",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Scale state after clearing the retained warning.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ScaleState" } } }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/profiles": {
      "get": {
        "operationId": "getExtractionProfiles",
        "summary": "Read all four persisted custom profile slots",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "The complete persisted machine profile set.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ProfileSet" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      },
      "put": {
        "operationId": "replaceExtractionProfiles",
        "summary": "Atomically replace all four custom profile slots while idle",
        "description": "The previous complete set remains persisted if validation or persistence fails.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ProfileSet" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The complete acknowledged persisted profile set.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ProfileSet" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": {
            "description": "An extraction or cooldown is active; no profile slot was changed.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    { "$ref": "#/components/schemas/ExtractionActiveConflictResponse" },
                    { "$ref": "#/components/schemas/CooldownActiveConflictResponse" }
                  ]
                }
              }
            }
          },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/extractions/start": {
      "post": {
        "operationId": "startExtraction",
        "summary": "Start Manual or one persisted profile idempotently",
        "description": "Start is accepted only in acknowledged Brew mode and while cooldown is idle. Replaying the same idempotency key and normalized selection returns the retained active or terminal extraction without issuing another pump-high command. Reusing a retained key with a different selection is rejected as idempotency_mismatch. A terminal record remains volatile until another key is successfully accepted or the device reboots.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/StartExtractionRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The same acknowledged active or terminal extraction for a new or replayed key.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    { "$ref": "#/components/schemas/RunningExtractionState" },
                    { "$ref": "#/components/schemas/TerminalExtractionState" }
                  ]
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": {
            "description": "The machine is not in Brew, a different extraction or cooldown is active, or the selected custom slot is empty.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    { "$ref": "#/components/schemas/ExtractionActiveConflictResponse" },
                    { "$ref": "#/components/schemas/CooldownActiveConflictResponse" },
                    { "$ref": "#/components/schemas/ApiV2ErrorResponse" }
                  ]
                }
              }
            }
          },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/extractions/stop": {
      "post": {
        "operationId": "stopExtraction",
        "summary": "Idempotently stop extraction and acknowledge idle",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Acknowledged idle or retained terminal state, including when extraction was already idle.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    { "$ref": "#/components/schemas/IdleExtractionState" },
                    { "$ref": "#/components/schemas/TerminalExtractionState" }
                  ]
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/extractions/stream": {
      "get": {
        "operationId": "streamExtractionTelemetry",
        "summary": "Stream bounded extraction telemetry pages",
        "description": "Authenticated Server-Sent Events for the retained current or most recent extraction. Supply no cursor parameters for the initial retained page, or supply extractionId, bootId, and afterSequence together for continuation. Each telemetry event contains one strict ExtractionTelemetryPage. Catch-up pages contain at most 16 samples; live pages contain one sample. Comment heartbeats carry no state. There is no polling fallback.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "extractionId",
            "in": "query",
            "required": false,
            "schema": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._~-]*$" }
          },
          {
            "name": "bootId",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistoryBootId" }
          },
          {
            "name": "afterSequence",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/HistorySequence" }
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream containing telemetry events whose data field is an ExtractionTelemetryPage, plus optional comment heartbeats.",
            "content": {
              "text/event-stream": {
                "schema": { "type": "string" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": { "$ref": "#/components/responses/V2Conflict" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/cooldowns/start": {
      "post": {
        "operationId": "startCooldown",
        "summary": "Start the firmware-owned cooldown workflow idempotently",
        "description": "A new key is eligible only while extraction and cooldown are idle, the validated Brew-effective temperature is above the current Brew target, and no sensor or machine fault prevents operation. Firmware switches to Brew, establishes the transient heater inhibit, commands the heater off, snapshots the Brew target, and only then commands the pump running. Replaying the retained key returns the original cooldown identity and current or terminal acknowledgement without restarting the 45-second pump deadline. A different key replaces a terminal acknowledgement only after fresh eligibility checks.",
        "security": [{ "bearerAuth": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/StartCooldownRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The acknowledged new, replayed, active, or retained terminal cooldown state. Same-key replay never restarts a deadline.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CooldownState" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/V2BadRequest" },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "409": {
            "description": "An extraction or different cooldown is active, or sensor, fault, or temperature eligibility rejects a new cooldown.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    { "$ref": "#/components/schemas/ExtractionActiveConflictResponse" },
                    { "$ref": "#/components/schemas/CooldownActiveConflictResponse" },
                    { "$ref": "#/components/schemas/ApiV2ErrorResponse" }
                  ]
                }
              }
            }
          },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    },
    "/api/v2/cooldowns/stop": {
      "post": {
        "operationId": "stopCooldown",
        "summary": "Idempotently stop cooldown pumping",
        "description": "While pumping, Stop commands the pump off and enters the same five-second stabilization phase with outcome stopped. During stabilization or idle it returns the current acknowledgement unchanged.",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "The acknowledged stabilizing or idle cooldown state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CooldownState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/V2Unauthorized" },
          "500": { "$ref": "#/components/responses/V2InternalError" }
        }
      }
    }
  },
