      "StartExtractionRequest": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["idempotencyKey", "selection"],
            "properties": {
              "idempotencyKey": { "type": "string", "minLength": 16, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._~-]*$" },
              "selection": { "$ref": "#/components/schemas/ExtractionSelection" }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["idempotencyKey", "selection", "weightControl"],
            "properties": {
              "idempotencyKey": { "type": "string", "minLength": 16, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9._~-]*$" },
              "selection": { "$ref": "#/components/schemas/ProfileExtractionSelection" },
              "weightControl": { "$ref": "#/components/schemas/WeightControl" }
            }
          }
        ],
        "examples": [
          {
            "idempotencyKey": "start-01J2ABCDEF1234",
            "selection": { "kind": "profile", "profileId": "profile-2" }
          },
          {
            "idempotencyKey": "start-weight-01J2ABCDEF",
            "selection": { "kind": "profile", "profileId": "profile-1" },
            "weightControl": { "targetWeightDecigrams": 350, "compensationDecigrams": 60 }
          }
        ]
      },
